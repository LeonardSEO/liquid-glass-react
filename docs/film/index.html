<!doctype html>
<html lang="en">

    <style>
      :root {
        --ground: #f6f7f2;
        --ink: #202322;
        --font-display: "Inter", sans-serif;

        background: var(--ground);

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.13" data-width="1280" data-height="720">

        id="demo"

        data-duration="14.13"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="14.13"
        data-duration="3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1280"
        data-height="720"
      ></div>

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

  </body>
</html>
